{# Shared "choose a person" dialog; people.js fills the list. #}
<dialog id="person-picker" class="picker">
  <form method="dialog">
    <h2>Choose a person</h2>
    <ul class="picker-list"></ul>
    <div class="toolbar">
      <button value="new" class="button secondary" data-new>New person</button>
      <button value="cancel" class="button secondary">Cancel</button>
    </div>
  </form>
</dialog>
