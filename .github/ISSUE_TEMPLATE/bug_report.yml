name: Bug report
description: Something is not working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before you paste anything: **remove personal paths (such as your user name) and do not attach your photos.**
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS (Apple Silicon)
        - Linux x86_64
        - Linux aarch64
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OGphotos version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        The end of `<app home>/logs/ogphotos.log` (Windows `%LOCALAPPDATA%\OGphotos\logs`, macOS `~/Library/Application Support/OGphotos/logs`, Linux `~/.local/share/ogphotos/logs`). Remove personal paths first.
      render: text
