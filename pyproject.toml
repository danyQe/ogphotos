[project]
name = "ogphotos"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.143.0",
    "imagehash>=4.3.2",
    "jinja2>=3.1.6",
    "numpy>=2.4.6",
    "onnxruntime>=1.31.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.4",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.19.0",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://danyqe.github.io/ogphotos"
Repository = "https://github.com/danyQe/ogphotos"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
]

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["model: slow tests that load the real embedding model"]
addopts = "-m 'not model'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
